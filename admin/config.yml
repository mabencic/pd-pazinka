# Konfiguracija CMS-a (Sveltia CMS) za uređivanje sadržaja na /admin/
# Svaka spremljena promjena postaje commit u GitHub repozitoriju na grani main,
# a Cloudflare Pages nakon toga sam objavi novu verziju stranice (1 do 2 minute).

backend:
  name: github
  repo: mabencic/pd-pazinka
  branch: main
  # Prijava osobnim GitHub tokenom. Za prijavu gumbom "Prijava s GitHubom" vidi upute u README.md
  # (dodaje se base_url i "oauth").
  auth_methods: [token]
  commit_messages:
    create: 'CMS: novo u "{{collection}}": {{slug}}'
    update: 'CMS: izmjena u "{{collection}}": {{slug}}'
    delete: 'CMS: brisanje iz "{{collection}}": {{slug}}'
    uploadMedia: "CMS: nova slika {{path}}"
    deleteMedia: "CMS: obrisana slika {{path}}"

app_title: PD Pazinka, uređivanje stranice

media_folder: images
public_folder: /images

output:
  omit_empty_optional_fields: true
  json:
    indent_size: 2

slug:
  encoding: ascii
  clean_accents: true

collections:
  # ------------------------------------------------------------------ OBJAVE
  - name: objave
    label: Objave
    label_singular: Objava
    description: Raspisi pohoda, izvještaji i novosti. Naziv datoteke postaje adresa objave (/objave/naziv/) i kasnije se ne mijenja.
    folder: content/objave
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{date | date('DD.MM.YYYY.')}} · {{title}}"
    sortable_fields:
      fields: [date, title]
      default: { field: date, direction: descending }
    view_filters:
      - { label: Raspisi, field: type, pattern: raspis }
      - { label: Izvještaji, field: type, pattern: izvjestaj }
      - { label: Novosti, field: type, pattern: novost }
    fields:
      - { name: title, label: Naslov, widget: string }
      - name: date
        label: Datum objave
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD.MM.YYYY.
        time_format: false
        default: "{{now}}"
      - name: type
        label: Vrsta
        widget: select
        default: novost
        options:
          - { label: Raspis, value: raspis }
          - { label: Izvještaj, value: izvjestaj }
          - { label: Novost, value: novost }
      - name: excerpt
        label: Sažetak
        widget: text
        hint: Kratki uvod koji se vidi u popisu objava i na početnoj stranici.
      - name: body
        label: Tekst
        label_singular: odlomak
        widget: list
        field: { name: p, label: Odlomak, widget: text }
        hint: Svaki odlomak je zasebna stavka.
      - name: image
        label: Fotografija
        widget: image
        required: false
        hint: Po mogućnosti do 1600 px širine. Koristi samo slike za koje društvo ima pravo objave.
      - name: imageAlt
        label: Opis fotografije
        widget: string
        required: false
        hint: Kratki opis onoga što je na slici (za slijepe i slabovidne te za tražilice).
      - name: art
        label: Ilustracija (ako nema fotografije)
        widget: select
        required: false
        default: 1
        options:
          - { label: Planine 1, value: 1 }
          - { label: Planine 2, value: 2 }
          - { label: Planine 3, value: 3 }

  # ------------------------------------------------------------------ POHODI
  - name: pohodi
    label: Kalendar pohoda
    label_singular: Pohod
    description: Pohodi kojima je datum prošao sami nestaju s kalendara na stranici, pa ih ne treba brisati.
    folder: content/pohodi
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{fields.date}}-{{slug}}"
    identifier_field: title
    summary: "{{date | date('DD.MM.YYYY.')}} · {{title}}"
    sortable_fields:
      fields: [date, title]
      default: { field: date, direction: ascending }
    view_filters:
      - { label: Nadolazeći, field: date, gte: "{{today}}" }
      - { label: Vodički, field: category, pattern: vodicki }
      - { label: Visokogorski, field: category, pattern: visoko }
      - { label: Markacisti, field: category, pattern: marka }
    fields:
      - { name: title, label: Naziv pohoda, widget: string }
      - name: date
        label: Datum
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD.MM.YYYY.
        time_format: false
      - name: dateEnd
        label: Datum završetka
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD.MM.YYYY.
        time_format: false
        required: false
        hint: Samo za višednevne pohode.
      - name: category
        label: Odsjek
        widget: select
        default: vodicki
        options:
          - { label: Vodički, value: vodicki }
          - { label: Visokogorski, value: visoko }
          - { label: Markacisti, value: marka }
      - name: level
        label: Zahtjevnost
        widget: select
        default: lagano
        options:
          - { label: Lagano, value: lagano }
          - { label: Srednje, value: srednje }
          - { label: Zahtjevno, value: zahtjevno }
      - name: post
        label: Raspis (objava)
        widget: relation
        collection: objave
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        required: false
        hint: Naslov pohoda u kalendaru tada vodi na ovu objavu.
      - { name: summary, label: Kratki opis, widget: text, required: false }
      - { name: departure, label: Polazak, widget: string, required: false, hint: "Npr. Subota 20.12. u 8:00, Pazin" }
      - { name: length, label: Duljina, widget: string, required: false, hint: "Npr. 10 km" }
      - { name: ascent, label: Uspon, widget: string, required: false, hint: "Npr. 300 m" }
      - { name: duration, label: Vrijeme hoda, widget: string, required: false, hint: "Npr. 4 h" }
      - { name: transport, label: Prijevoz, widget: string, required: false }
      - { name: guides, label: Vodiči, widget: string, required: false }
      - { name: registerUrl, label: Poveznica za prijavu, widget: string, type: url, required: false }
      - { name: registerText, label: Tekst gumba za prijavu, widget: string, required: false, hint: "Npr. Prijave do 20.11.2026." }
      - name: hero
        label: Prikaži u kartici "Najbliži pohod" na početnoj
        widget: boolean
        default: true
        required: false

  # ------------------------------------------------------------------ STRANICE
  - name: stranice
    label: Stranice
    description: Stalni sadržaj stranice.
    files:
      # ---------------------------------------------------- Sklonište
      - name: skloniste
        label: Sklonište Kremenjak
        file: content/skloniste.json
        format: json
        fields:
          - { name: label, label: Nadnaslov, widget: string }
          - { name: title, label: Naslov, widget: string }
          - { name: image, label: Fotografija, widget: image, required: false }
          - { name: imageAlt, label: Opis fotografije, widget: string, required: false }
          - { name: text, label: Uvodni tekst, widget: text }
          - name: facts
            label: Podaci
            label_singular: podatak
            widget: list
            summary: "{{k}}: {{v}}"
            fields:
              - { name: k, label: Naziv, widget: string }
              - { name: v, label: Vrijednost, widget: string }
          - name: more
            label: Dodatni tekst
            label_singular: odlomak
            widget: list
            field: { name: p, label: Odlomak, widget: text }

      # ---------------------------------------------------- Članstvo
      - name: clanstvo
        label: Članstvo
        file: content/clanstvo.json
        format: json
        fields:
          - { name: title, label: Naslov, widget: string }
          - name: steps
            label: Koraci upisa
            label_singular: korak
            widget: list
            fields:
              - { name: title, label: Naslov, widget: string }
              - { name: text, label: Tekst, widget: text }
          - { name: categoriesTitle, label: Naslov članarine, widget: string, hint: "Npr. Članarina za 2027." }
          - { name: categoriesNote, label: Napomena uz članarinu, widget: string, required: false }
          - name: categories
            label: Kategorije članarine
            label_singular: kategorija
            widget: list
            summary: "{{name}}: {{price}}"
            fields:
              - { name: name, label: Kategorija, widget: string }
              - { name: note, label: Napomena, widget: string, required: false }
              - { name: price, label: Iznos, widget: string, hint: "Npr. 20 EUR" }
          - { name: benefitsTitle, label: Naslov povlastica, widget: string }
          - name: benefits
            label: Povlastice
            label_singular: povlastica
            widget: list
            field: { name: b, label: Povlastica, widget: string }

      # ---------------------------------------------------- Planinarski putovi
      - name: putovi
        label: Planinarski putovi
        file: content/putovi.json
        format: json
        fields:
          - { name: title, label: Naslov, widget: string }
          - { name: intro, label: Uvod, widget: text }
          - name: rows
            label: Putovi
            label_singular: put
            widget: list
            summary: "{{mark}} · {{name}}"
            fields:
              - { name: mark, label: Broj puta, widget: string }
              - { name: name, label: Naziv, widget: string }
              - { name: mountain, label: Gora, widget: string }
              - { name: km, label: Duljina (km), widget: string, hint: "Decimalni zarez, npr. 3,10" }
              - { name: time, label: Vrijeme hoda, widget: string, hint: "Npr. 1:30" }

      # ---------------------------------------------------- Odsjeci
      - name: odsjeci
        label: Odsjeci
        file: content/odsjeci.json
        format: json
        fields:
          - name: odsjeci
            label: Odsjeci
            label_singular: odsjek
            widget: list
            root: true
            allow_add: false
            allow_remove: false
            allow_reorder: false
            summary: "{{title}}"
            fields:
              - { name: slug, label: Adresa stranice, widget: string, readonly: true, hint: "Ne mijenja se, na nju vode izbornik i pločice." }
              - { name: label, label: Nadnaslov (pročelnik), widget: string }
              - { name: title, label: Naziv odsjeka, widget: string }
              - { name: text, label: Opis, widget: text }
              - name: items
                label: Istaknute stavke
                label_singular: stavka
                widget: list
                field: { name: i, label: Stavka, widget: string }
              - name: link
                label: Poveznica
                widget: object
                required: false
                fields:
                  - { name: label, label: Tekst poveznice, widget: string }
                  - { name: href, label: Adresa, widget: string }
              - name: groups
                label: Članovi
                label_singular: skupina
                widget: list
                summary: "{{title}}"
                fields:
                  - { name: title, label: Naziv skupine, widget: string }
                  - name: people
                    label: Osobe
                    label_singular: osoba
                    widget: list
                    field: { name: o, label: Osoba, widget: string }
              - name: more
                label: Dodatni tekst
                label_singular: odlomak
                widget: list
                required: false
                field: { name: p, label: Odlomak, widget: text }

      # ---------------------------------------------------- Osnovni podaci
      - name: site
        label: Osnovni podaci, početna i O nama
        file: content/site.json
        format: json
        fields:
          - { name: name, label: Naziv društva, widget: string }
          - { name: tagline, label: Mjesto (ispod naziva), widget: string }
          - { name: description, label: Opis stranice za tražilice, widget: text }
          - name: contact
            label: Kontakt
            widget: object
            fields:
              - name: address
                label: Adresa
                label_singular: redak
                widget: list
                field: { name: a, label: Redak adrese, widget: string }
              - { name: email, label: E-pošta, widget: string, type: email }
              - { name: meetings, label: Sastanci, widget: string, required: false, hint: "Npr. Sastanci srijedom u 19 h" }
              - { name: facebook, label: Facebook, widget: string, type: url, required: false }
          - { name: founded, label: Osnivanje (u podnožju), widget: string, required: false }
          - { name: footerNote, label: Napomena u podnožju, widget: string, required: false }

          - { name: heroLabel, label: "Početna: nadnaslov", widget: string }
          - { name: heroTitle, label: "Početna: naslov", widget: string }
          - { name: heroLead, label: "Početna: uvodni tekst", widget: text }
          - { name: heroImage, label: "Početna: naslovna fotografija", widget: image, required: false }
          - name: tiles
            label: "Početna: pločice"
            label_singular: pločica
            widget: list
            summary: "{{title}}"
            fields:
              - { name: title, label: Naslov, widget: string }
              - { name: text, label: Tekst, widget: string }
              - { name: href, label: Adresa, widget: string, hint: "Npr. /kalendar-pohoda/" }

          - { name: aboutText, label: "O nama: osnovni podaci", widget: text }
          - name: board
            label: "O nama: upravni odbor"
            widget: object
            fields:
              - { name: title, label: Naslov, widget: string, hint: "Npr. Upravni odbor 2024. – 2026." }
              - name: members
                label: Članovi
                label_singular: član
                widget: list
                field: { name: m, label: "Ime i funkcija", widget: string }
          - { name: aboutHikingTitle, label: "O nama: naslov o planinarenju", widget: string }
          - name: aboutHiking
            label: "O nama: tekst o planinarenju"
            label_singular: odlomak
            widget: list
            field: { name: p, label: Odlomak, widget: text }
          - { name: historyTitle, label: "O nama: naslov povijesti", widget: string }
          - name: history
            label: "O nama: povijest"
            label_singular: godina
            widget: list
            summary: "{{y}}"
            fields:
              - { name: y, label: Godina, widget: string, hint: "Npr. 1981." }
              - { name: t, label: Tekst, widget: text }

          - name: nav
            label: Izbornik
            label_singular: stavka izbornika
            widget: list
            collapsed: true
            summary: "{{label}}"
            hint: Mijenjaj oprezno, adrese moraju odgovarati postojećim stranicama.
            fields:
              - { name: label, label: Naziv, widget: string }
              - { name: href, label: Adresa, widget: string }
              - name: children
                label: Podizbornik
                label_singular: stavka
                widget: list
                required: false
                summary: "{{label}}"
                fields:
                  - { name: label, label: Naziv, widget: string }
                  - { name: href, label: Adresa, widget: string }
              - name: match
                label: Dodatne adrese koje označavaju ovu stavku
                widget: list
                required: false
                field: { name: m, label: Adresa, widget: string }
              - { name: join, label: Istaknuti gumb (crveni), widget: boolean, required: false, default: false }

          - { name: url, label: Javna adresa stranice, widget: string, type: url, required: false, hint: "Npr. https://www.pd-pazinka.hr. Potrebna za kartu stranice (sitemap)." }
          - { name: noindex, label: Sakrij stranicu od tražilica, widget: boolean, default: true, hint: "Isključi kad stranica bude spremna za javnost." }
